<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>meta-sovereign</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app">
      <a class="skip-link" href="#root">Skip to main content</a>
      <header class="topbar" role="banner">
        <h1>meta-sovereign</h1>
        <nav aria-label="Primary">
          <button type="button" data-view="chat" class="active">Chat</button>
          <button type="button" data-view="operator">Operator</button>
          <button type="button" data-view="contacts">Contacts</button>
          <button type="button" data-view="automation">Automation</button>
          <button type="button" data-view="patterns">Patterns</button>
          <button type="button" data-view="replies">Replies</button>
          <button type="button" data-view="facts">Facts</button>
          <button type="button" data-view="audience">Audience</button>
          <button type="button" data-view="broadcast">Broadcast</button>
          <button type="button" data-view="outreach">Outreach</button>
          <button type="button" data-view="profile">Profile</button>
          <button type="button" data-view="backup">Backup</button>
          <button type="button" data-view="status">Status</button>
          <button type="button" data-view="settings">Settings</button>
        </nav>
        <span class="mode-badge offline">offline</span>
        <button
          type="button"
          class="theme-toggle"
          data-action="theme-toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
          title="Toggle dark mode"
        >
          Theme
        </button>
      </header>
      <main id="root" role="main" tabindex="-1"></main>
    </div>
    <script src="./discovery-shell.js"></script>
    <script type="module" src="./app.min.js"></script>
  </body>
</html>
