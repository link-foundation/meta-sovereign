version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
  - package-ecosystem: cargo
    directories:
      - /rust
      - /rust/crates/meta-sovereign-core
      - /rust/crates/meta-sovereign-server
      - /rust/crates/meta-sovereign-wasm
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Python experiments use only the standard library; Swift uses Apple SDKs.
  # Add pip/swift entries only when a dependency manifest is introduced.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
