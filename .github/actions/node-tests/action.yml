name: Node tests and failure diagnostics
description: Run the complete assigned shard and preserve Windows storage traces after failure.
inputs:
  shard:
    description: Complete Node test partition assigned by the workflow matrix.
    required: true
  artifact:
    description: Unique diagnostic artifact name for this matrix job.
    required: true
runs:
  using: composite
  steps:
    - name: Run assigned Node test shard
      id: node-tests
      shell: bash
      env:
        TEST_SHARD: ${{ inputs.shard }}
        MS_LIFECYCLE_DEBUG: ${{ runner.os != 'Linux' && '1' || '0' }}
        MS_CLINK_DEBUG: ${{ runner.os != 'Linux' && '1' || '0' }}
        MS_APPLICATION_LIMIT_DEBUG: ${{ runner.os == 'Windows' && '1' || '0' }}
      run: node --test --test-concurrency=2 --test-timeout=30000 --test-shard="$TEST_SHARD" "js/tests/*.test.js"

    - name: Trace the five timed-out Windows storage fixtures
      if: failure() && steps.node-tests.outcome == 'failure' && runner.os == 'Windows'
      shell: bash
      run: node experiments/issue-56/storage-windows-timeout.mjs

    - name: Preserve Windows storage operation traces
      if: failure() && steps.node-tests.outcome == 'failure' && runner.os == 'Windows'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ci-logs/storage-timeout/
        if-no-files-found: ignore
        retention-days: 7
