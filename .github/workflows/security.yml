name: Scheduled security audit
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  dependencies:
    name: Audit installed npm dependencies and Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit --package-lock-only --audit-level=low
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file rust/Cargo.lock --deny warnings

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, rust, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4

  pipeline-status:
    name: Security pipeline status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    needs: [dependencies, codeql]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node js/scripts/check-pipeline-status.mjs
