name: Scheduled security audit
on:
  # Main has this configuration family as well as release.yml. GitHub's
  # aggregate PR check needs both, including documentation-only changes.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  dependencies:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependencies-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Audit installed npm dependencies and Cargo.lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] -- Exact bootstrap tool pin; project dependencies use npm ci.

      - run: npm ci --no-audit --no-fund
      - run: npm audit --package-lock-only --audit-level=low
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file rust/Cargo.lock --deny warnings

  codeql:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, rust, actions]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          output: artifacts/codeql
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Reject unresolved CodeQL findings
        run: node js/scripts/check-codeql-results.mjs artifacts/codeql
      - name: Preserve CodeQL reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: artifacts/codeql
          if-no-files-found: error

  pipeline-status:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Security pipeline status
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    needs: [dependencies, codeql]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
      - name: Use pinned npm
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] -- Exact bootstrap tool pin; project dependencies use npm ci.

      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node js/scripts/check-pipeline-status.mjs
