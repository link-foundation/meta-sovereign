name: Deploy to GitHub Pages

# Builds and deploys the SPA bundle (`js/src/web/`) to GitHub Pages so
# any user can open the meta-sovereign web app from a browser without
# cloning the repo first. The deployed bundle is the same React SPA
# shipped with the desktop and mobile apps; it boots offline-first
# via OfflineClient + BrowserStore and discovers a local Rust or JS
# server when one is reachable.
#
# See docs/case-studies/issue-8/solution-plan.md for the requirement
# trace (R-L1..R-L5, R-L3a..d, R-L4a..c).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Allow only one concurrent deployment, queue future pushes so we
# don't skip a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build SPA bundle
    runs-on: ubuntu-latest
    # Typical run: ~30s (esbuild + copy). 10min cap matches the
    # rest of release.yml's fast jobs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static Pages bundle
        run: node js/scripts/build-pages.mjs

      - name: Verify required artefacts exist
        run: |
          set -e
          for f in index.html 404.html .nojekyll manifest.webmanifest app.min.js app.css download/index.html download/page.js download/downloads.js; do
            if [ ! -f "dist/pages/$f" ]; then
              echo "::error::missing required Pages artefact: $f"
              exit 1
            fi
          done

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Typical run: ~30s (deploy-pages mostly waits on GitHub).
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test the deployed bundle
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then
            echo "::error::deploy-pages did not return a page_url"
            exit 1
          fi
          echo "Probing $url"
          # Retry a few times: Pages can take a few seconds to be
          # reachable after deploy-pages reports success.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 "$url" -o /tmp/index.html; then
              if grep -q "meta-sovereign" /tmp/index.html; then
                echo "Smoke test passed on attempt $attempt"
                exit 0
              fi
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Pages bundle did not respond as expected after 5 attempts"
          exit 1

  # R-O14 / R-Y58 / R-Y60: the deployed site, opened in headless
  # Chromium and WebKit, must find a local server (started here, with a
  # made-up chat) and work like the copy the server serves itself
  # (js/tests/e2e-pages.mjs).
  e2e-deployed:
    name: E2E against the deployed site
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Chromium for browser-commander, WebKit for the Safari run.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      # Ubuntu 24.04 keeps unprivileged user namespaces from AppArmor'd
      # programs, which Chromium's sandbox needs; allow them rather than
      # running the browser without its sandbox.
      - name: Let Chromium sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Hosted app against a local server
        env:
          RUN_BROWSER_E2E: '1'
          E2E_LAUNCH: engine
          # Our port: the app must find the server there by itself.
          E2E_PORT: '8787'
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # Pages' cache can serve the previous files for a few minutes.
          for attempt in 1 2 3 4 5; do
            npm run test:e2e:pages && exit 0
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          exit 1

  # The same check on a pull request, against the bundle built from it
  # and served from its own origin, as Pages would.
  e2e-bundle:
    name: E2E against the built bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Chromium for browser-commander, WebKit for the Safari run.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      # Ubuntu 24.04 keeps unprivileged user namespaces from AppArmor'd
      # programs, which Chromium's sandbox needs; allow them rather than
      # running the browser without its sandbox.
      - name: Let Chromium sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Hosted app against a local server
        env:
          RUN_BROWSER_E2E: '1'
          E2E_LAUNCH: engine
          # Our port: the app must find the server there by itself.
          E2E_PORT: '8787'
        run: npm run test:e2e:pages
