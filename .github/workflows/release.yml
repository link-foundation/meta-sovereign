name: Checks and release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual release support - consolidated here to work with npm trusted publishing
  # npm only allows ONE workflow file as trusted publisher, so all publishing
  # must go through this workflow (release.yml)
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Detect Changes
    runs-on: ubuntu-24.04
    # Typical run: ~5s. Cap at 5min so a hung detection step
    # surfaces quickly instead of stalling the whole pipeline.
    timeout-minutes: 5
    outputs:
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      js-changed: ${{ steps.changes.outputs.js-changed }}
      package-changed: ${{ steps.changes.outputs.package-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node js/scripts/detect-code-changes.mjs

  release-preflight:
    name: Release credential preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      graph-enabled: ${{ steps.graph.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Check dependency review capability before building
        id: graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_GRAPH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
        run: node js/scripts/dependency-graph.mjs
      - name: Verify npm trusted publisher before building
        id: npm
        continue-on-error: true
        env:
          PREFLIGHT_MODE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant')) && 'release' || 'report' }}
        run: node js/scripts/preflight-release.mjs

      - name: Require every release prerequisite
        if: ${{ !cancelled() }}
        env:
          GRAPH_OUTCOME: ${{ steps.graph.outcome }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
        run: |
          if [ "$GRAPH_OUTCOME" != success ] || [ "$NPM_OUTCOME" != success ]; then
            echo "::error::Release preflight failed. Review every prerequisite above; administrator setup is required before a main release can build."
            exit 1
          fi

  # === FAST CHECKS - run before slow tests for fastest feedback ===
  # See: hive-mind CI/CD best practices principle #5 (fast-fail job ordering)

  # Syntax check all .mjs files with node --check (~7s)
  test-compilation:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-compilation-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Test Compilation
    runs-on: ubuntu-24.04
    # Typical run: ~4s. Tight cap fails fast on accidental infinite loops.
    timeout-minutes: 5
    needs: [detect-changes, release-preflight]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mjs-changed == 'true' ||
      needs.detect-changes.outputs.js-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check .mjs syntax
        run: bash js/scripts/check-mjs-syntax.sh

  # Enforce 1500-line limit on .mjs files and release.yml
  check-file-line-limits:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-check-file-line-limits-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Check File Line Limits
    runs-on: ubuntu-24.04
    # Typical run: ~3s. Just walks the tree counting lines.
    timeout-minutes: 5
    needs: [detect-changes, release-preflight]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mjs-changed == 'true' ||
      needs.detect-changes.outputs.js-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Check file line limits
        run: bash js/scripts/check-file-line-limits.sh

  # === VERSION CHANGE CHECK ===
  # Prohibit manual version changes in package.json - versions should only be changed by CI/CD
  version-check:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-version-check-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Check for Manual Version Changes
    runs-on: ubuntu-24.04
    # Typical run: ~6s. Read-only diff inspection.
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for version changes in package.json
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node js/scripts/check-version.mjs

  # === CHANGESET CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changesets
  changeset-check:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changeset-check-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Check for Changesets
    runs-on: ubuntu-24.04
    # Typical run: ~13s including npm install. 10min covers cold cache.
    timeout-minutes: 10
    needs: [detect-changes, release-preflight]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check for changesets
        env:
          # Pass PR context to the validation script
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Skip changeset check for automated version PRs
          if [[ "$PR_HEAD_REF" == "changeset-release/"* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi

          # Run changeset validation script
          # This validates that exactly ONE changeset was ADDED by this PR
          # Pre-existing changesets from other merged PRs are ignored
          node js/scripts/validate-changeset.mjs

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changeset-check - it's a fast check that should always run
  # See: https://github.com/link-assistant/hive-mind/pull/1024 for why this dependency was removed
  # IMPORTANT: ESLint includes max-lines rule (1500 lines) to ensure files stay maintainable
  # See docs/case-studies/issue-23 for why fresh merge simulation is critical
  lint:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    # Typical run: ~23s including npm install + ESLint + Prettier + jscpd
    # + secretlint. 10min cap protects against a hung lint plugin.
    timeout-minutes: 10
    needs: [detect-changes, release-preflight]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mjs-changed == 'true' ||
      needs.detect-changes.outputs.js-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true' ||
      needs.detect-changes.outputs.package-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # For PRs, fetch enough history to merge with base branch
          fetch-depth: 0

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check code duplication
        run: npm run check:duplication

      - name: Check for secrets
        run: npx --no-install secretlint "**/*"

  # Test matrix: 3 runtimes (Node.js, Bun, Deno) x 3 OS (Ubuntu, macOS, Windows)
  # IMPORTANT: Tests must validate the ACTUAL merge result, not a stale merge preview.
  # See docs/case-studies/issue-23 for why this is critical.
  # Fast-fail: slow test matrix only runs after fast checks pass (hive-mind principle #5)
  test:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Test (${{ matrix.runtime }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Typical run: 13–55s (deno on Windows can spike to ~2min on cold runners).
    # 10min cap surfaces a hung test or flaky network well before the
    # 6h GitHub default — the user wants flaky tests to fail fast.
    timeout-minutes: 10
    needs:
      [
        detect-changes,
        release-preflight,
        changeset-check,
        test-compilation,
        lint,
        check-file-line-limits,
        version-check,
        workflow-lint,
      ]
    # Use !cancelled() instead of always() so cancellation propagates correctly (hive-mind issue #1278)
    # Run if: push event, OR changeset-check succeeded, OR changeset-check was skipped (docs-only PR)
    # AND all fast checks passed (or were skipped for irrelevant changes)
    if: |-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (!cancelled() && needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.any-code-changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
      (needs.test-compilation.result == 'success' || needs.test-compilation.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.check-file-line-limits.result == 'success' || needs.check-file-line-limits.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # For PRs, fetch enough history to merge with base branch
          fetch-depth: 0

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies (Node.js)
        if: matrix.runtime == 'node'
        run: npm ci --no-audit --no-fund

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: node --test --test-concurrency=2 --test-timeout=30000 js/tests/*.test.js

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        # --timeout caps an individual test at 30s. Default is 5s but a few
        # WebRTC / WebSocket scenarios run slower on cold runners; 30s leaves
        # headroom while still failing fast on a hung promise.
        run: bun test --timeout 30000

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install reviewed native dependency scripts (Deno)
        if: matrix.runtime == 'deno'
        run: deno install

      - name: Run tests (Deno)
        if: matrix.runtime == 'deno'
        shell: bash
        # Deno requires --allow-all for private Windows named pipes. Tests
        # remain isolated in fixture stores and never use personal accounts.
        env:
          CI_CRYPTO_DIAGNOSTICS: ${{ runner.os == 'Windows' && '1' || '0' }}
          RUST_BACKTRACE: '1'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then node experiments/issue43-cifrante.mjs; fi
          deno test --allow-all js/tests

  # === RUST CRATES (R-Z6) ===
  # fmt, clippy (warnings are errors) and the crates' own tests, so the
  # Rust port can not rot unseen. Required by the terminal release gate.
  rust:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-rust-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    # Cold build ~4min, cached ~1min.
    timeout-minutes: 20
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        check-file-line-limits,
        test-compilation,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.rust-changed == 'true' || needs.detect-changes.outputs.workflow-changed == 'true'))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  # === BROWSER E2E (R-Z6) ===
  # A representative set of the `test:e2e:*` scripts in chromium: the SPA
  # smoke test, the chat basics, rich and service messages, ephemeral
  # messages, accounts and data export, offline, the passcode, rich text,
  # Instant View, email, greetings, autopilot, the peer bar and the tutorial.
  # Each script prints OK or fails; all run, then the job reports every
  # failure at once; both engines are release gates.
  e2e-browser:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-e2e-browser-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Browser e2e (${{ matrix.browser }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        test-compilation,
        check-file-line-limits,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.detect-changes.outputs.any-code-changed == 'true' || needs.detect-changes.outputs.workflow-changed == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: ubuntu-24.04
          - browser: webkit
            runner: macos-15
    env:
      RUN_BROWSER_E2E: '1'
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_ENGINES: ${{ matrix.browser }}
      E2E_SAFARI: '0'
      E2E_ARTIFACT_DIR: artifacts/browser
      DEBUG: ${{ vars.CI_BROWSER_DEBUG == '1' && 'pw:api' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the fresh merge
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - run: npm run build:web
      - name: Run browser checks
        id: browser-checks
        run: node js/scripts/run-browser-checks.mjs
      - name: Preserve browser diagnostics
        if: ${{ !cancelled() && steps.browser-checks.outcome != 'skipped' && steps.browser-checks.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14

  # === API DOCUMENTATION BUILD ===
  # Build JS API docs (`npm run docs:api`) and Rust crate docs
  # (`cargo doc --manifest-path rust/Cargo.toml --no-deps`) on every push and PR. This catches doc-comment
  # errors before release and produces artefacts the `release` job attaches
  # to GitHub Releases (R-H3).
  docs-build:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-docs-build-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Build API Docs
    runs-on: ubuntu-24.04
    # Typical run: ~25s. cargo doc dominates and is well-bounded.
    timeout-minutes: 15
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        test-compilation,
        check-file-line-limits,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: |-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mjs-changed == 'true' ||
      needs.detect-changes.outputs.js-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true' ||
      needs.detect-changes.outputs.rust-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build JS API docs
        run: npm run docs:api

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build Rust crate docs
        run: cargo doc --manifest-path rust/Cargo.toml --no-deps --workspace

      - name: Upload JS API docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-api-js
          path: docs/api/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rust crate docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-api-rust
          path: rust/target/doc/
          if-no-files-found: error
          retention-days: 30

  # === DOCUMENTATION VALIDATION ===
  # Validate documentation files when docs change (hive-mind principle #12)
  validate-docs:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-validate-docs-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Validate Documentation
    runs-on: ubuntu-24.04
    # Typical run: <5s. Pure shell file walk.
    timeout-minutes: 5
    needs: [detect-changes, release-preflight]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.docs-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check documentation file sizes
        run: |
          LIMIT=2500
          FAILURES=()

          echo "Checking that documentation files are under ${LIMIT} lines..."

          while IFS= read -r -d '' file; do
            line_count=$(wc -l < "$file")
            if [ "$line_count" -gt "$LIMIT" ]; then
              echo "ERROR: $file has $line_count lines (limit: ${LIMIT})"
              echo "::error file=$file::Documentation file has $line_count lines (limit: ${LIMIT})"
              FAILURES+=("$file")
            fi
          done < <(find docs -name "*.md" -type f -print0 2>/dev/null)

          if [ "${#FAILURES[@]}" -gt 0 ]; then
            echo "The following docs exceed the ${LIMIT} line limit:"
            printf '  %s\n' "${FAILURES[@]}"
            exit 1
          else
            echo "All documentation files are within the ${LIMIT} line limit."
          fi

      - name: Check required documentation files exist
        run: |
          REQUIRED_FILES=(
            "docs/BEST-PRACTICES.md"
            "docs/CONTRIBUTING.md"
            "docs/ROADMAP.md"
            "docs/REQUIREMENTS.md"
            "README.md"
            "CHANGELOG.md"
          )

          MISSING=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required documentation file missing: $file"
              MISSING+=("$file")
            else
              echo "Found: $file"
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo ""
            echo "Missing required documentation files:"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          else
            echo "All required documentation files present."
          fi

  # The package as npm would ship it, without publishing: `npm pack`
  # builds the tarball `npm publish` uploads, npx runs it, and the
  # server must default to Pages and expose its local HTTPS API
  # (js/tests/pack-smoke.mjs).
  package:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-package-${{ strategy.job-index || 0 }}
      cancel-in-progress: true
    name: Package (packed and run with npx)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        test-compilation,
        check-file-line-limits,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: |-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.any-code-changed == 'true' ||
      needs.detect-changes.outputs.package-changed == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # npm pack lists the same files without asking the registry, which
      # refuses a dry-run publish of a version that is already released.
      - name: What npm publish would upload
        run: npm pack --dry-run --ignore-scripts

      - name: Run the packed package with npx
        env:
          PACK_SMOKE_ARTIFACT_DIR: artifacts/pack
          CI_SCRIPTS_DEBUG: ${{ vars.CI_SCRIPTS_DEBUG }}
        run: npm run test:pack

      - name: Preserve package diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-diagnostics
          path: artifacts/pack/
          if-no-files-found: error

  backup-memory:
    name: Backup memory regression (200k links)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        test-compilation,
        check-file-line-limits,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.detect-changes.outputs.any-code-changed == 'true' || github.event_name == 'workflow_dispatch'))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci --no-audit --no-fund
      - name: Verify streaming memory bound and complete round trip
        env:
          RUN_BACKUP_STRESS: '1'
        run: node --max-old-space-size=384 --test --test-name-pattern='200k-link' js/tests/backup-stream.test.js

  workflow-lint:
    name: Workflow, shell and pipeline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, release-preflight]
    if: needs.detect-changes.outputs.any-code-changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci --no-audit --no-fund
      - name: actionlint, ShellCheck and pyflakes
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: ShellCheck standalone scripts and hooks
        run: git ls-files -z -- '*.sh' '.husky/*' ':(exclude)dev/log/**' ':(exclude)docs/case-studies/**' | xargs -0 docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 --shell=bash
      - name: Install pinned workflow security scanner
        run: pipx install zizmor==1.30.1
      - name: Workflow security audit (offline deterministic policy)
        run: zizmor --offline --format plain .github/workflows
      - name: Check pipeline gate and browser coverage
        run: node js/scripts/check-ci-workflows.mjs
      - run: node --test --test-concurrency=1 js/tests/ci-*.test.js

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, release-preflight]
    if: needs.detect-changes.outputs.any-code-changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit --package-lock-only --audit-level=low
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file rust/Cargo.lock --deny warnings

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      [
        detect-changes,
        release-preflight,
        lint,
        test-compilation,
        check-file-line-limits,
        changeset-check,
        version-check,
        workflow-lint,
      ]
    if: "!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.detect-changes.outputs.any-code-changed == 'true' || github.event_name == 'workflow_dispatch')"
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, rust, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, release-preflight]
    if: github.event_name == 'pull_request' && needs.release-preflight.outputs.graph-enabled == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  pipeline-status:
    name: Pipeline status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    needs:
      [
        detect-changes,
        release-preflight,
        test-compilation,
        check-file-line-limits,
        version-check,
        changeset-check,
        lint,
        test,
        rust,
        e2e-browser,
        docs-build,
        validate-docs,
        package,
        backup-memory,
        workflow-lint,
        dependency-audit,
        dependency-review,
        codeql,
      ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node js/scripts/check-pipeline-status.mjs

  # Release - only runs on main after tests pass (for push events)
  release:
    concurrency:
      group: release-main
      cancel-in-progress: false
    name: Release
    # Cap publish work (changeset merge, version commit, npm publish,
    # GitHub release, doc upload). Typical run is well under 10min;
    # 30min covers npm registry retries on a bad day.
    timeout-minutes: 30
    needs: [pipeline-status, release-preflight]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.pipeline-status.result == 'success'
    runs-on: ubuntu-24.04
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure release git authentication
        run: gh auth setup-git

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update npm for OIDC trusted publishing
        run: node js/scripts/setup-npm.mjs

      - name: Check for changesets
        id: check_changesets
        run: node js/scripts/check-changesets.mjs

      - name: Check if release is needed
        id: check_release
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
        run: node js/scripts/check-release-needed.mjs

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        run: |
          echo "Multiple changesets detected, merging..."
          node js/scripts/merge-changesets.mjs

      - name: Version packages and commit to main
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        run: node js/scripts/version-and-commit.mjs --mode changeset

      - name: Publish to npm
        # Run if version was committed, if a previous attempt already committed (for re-runs),
        # or if check-release-needed detected an unpublished version (self-healing, issue #36)
        if: >-
          steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true' || (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        id: publish
        run: node js/scripts/publish-to-npm.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.published_version || steps.check_release.outputs.current_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMITISH: HEAD
          COMMIT_SHA: HEAD
        run: node js/scripts/create-github-release.mjs

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.published_version || steps.check_release.outputs.current_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMITISH: HEAD
          COMMIT_SHA: HEAD
        run: node js/scripts/format-github-release.mjs

      - name: Build JS API docs for release
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        run: npm run docs:api

      - name: Setup Rust toolchain for release docs
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build Rust crate docs for release
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        run: cargo doc --manifest-path rust/Cargo.toml --no-deps --workspace

      - name: Attach API docs to GitHub Release
        if: steps.publish.outputs.published == 'true' || steps.check_release.outputs.github_release_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.publish.outputs.published_version || steps.check_release.outputs.current_version }}
        run: bash js/scripts/attach-api-docs.sh "$RELEASE_TAG"

  # Manual Instant Release - triggered via workflow_dispatch with instant mode
  # This job is in release.yml because npm trusted publishing
  # only allows one workflow file to be registered as a trusted publisher
  instant-release:
    concurrency:
      group: release-main
      cancel-in-progress: false
    name: Instant Release
    needs: [pipeline-status, release-preflight]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.release_mode == 'instant'
    runs-on: ubuntu-24.04
    # Same envelope as the automated release path.
    timeout-minutes: 30
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure release git authentication
        run: gh auth setup-git

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update npm for OIDC trusted publishing
        run: node js/scripts/setup-npm.mjs

      - name: Version packages and commit to main
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
        run: node js/scripts/version-and-commit.mjs --mode instant

      - name: Publish to npm
        # Run if version was committed OR if a previous attempt already committed (for re-runs)
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        run: node js/scripts/publish-to-npm.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMITISH: HEAD
          COMMIT_SHA: HEAD
        run: node js/scripts/create-github-release.mjs

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMITISH: HEAD
          COMMIT_SHA: HEAD
        run: node js/scripts/format-github-release.mjs

      - name: Build JS API docs for release
        if: steps.publish.outputs.published == 'true'
        run: npm run docs:api

      - name: Setup Rust toolchain for release docs
        if: steps.publish.outputs.published == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build Rust crate docs for release
        if: steps.publish.outputs.published == 'true'
        run: cargo doc --manifest-path rust/Cargo.toml --no-deps --workspace

      - name: Attach API docs to GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.publish.outputs.published_version }}
        run: bash js/scripts/attach-api-docs.sh "$RELEASE_TAG"

  # Manual Changeset PR - creates a pull request with the changeset for review
  changeset-pr:
    concurrency:
      group: release-main
      cancel-in-progress: false
    name: Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-24.04
    # PR creation only — install + format + open PR. 10min is generous.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create changeset file
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
        run: node js/scripts/create-manual-changeset.mjs

      - name: Format changeset with Prettier
        run: |
          # Run Prettier on the changeset file to ensure it matches project style
          npx prettier --write ".changeset/*.md"

          echo "Formatted changeset files"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The automated release workflow will create a version PR
            4. Merge the version PR to publish to npm and create a GitHub release
